<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWEB1 — Cap. 05 — AT02 — Cadastro de Usuário</title>

</head>
<body>
<header>
    <h1>Cadastro de Usuário</h1>
    <p><a href="https://andre75-10.github.io">← Voltar para a página principal</a></p>
  </header>
<main>
    <h1>Cadastro de Usuário</h1>

    <form action="https://httpbin.org/post" method="POST">
        <div>
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required minlength="3">
        </div>

        <div>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required minlength="8">
        </div>

        <div>
            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>
        </div>

        <fieldset>
            <legend>Gênero</legend>
            <div>
                <input type="radio" id="genero_masculino" name="genero" value="masculino">
                <label for="genero_masculino">Masculino</label>
            </div>
            <div>
                <input type="radio" id="genero_feminino" name="genero" value="feminino">
                <label for="genero_feminino">Feminino</label>
            </div>
            <div>
                <input type="radio" id="genero_outro" name="genero" value="outro">
                <label for="genero_outro">Outro</label>
            </div>
            <div>
                <input type="radio" id="genero_prefiro_nao_informar" name="genero" value="prefiro_nao_informar">
                <label for="genero_prefiro_nao_informar">Prefiro não informar</label>
            </div>
        </fieldset>

        <div>
            <input type="checkbox" id="aceite" name="aceite" value="sim" required>
            <label for="aceite">Aceito os termos de uso</label>
        </div>

        <div>
            <button type="submit">Criar conta</button>
            <button type="reset">Limpar campos</button>
        </div>
    </form>
</main>
</body>
</html>
